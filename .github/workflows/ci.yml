name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    name: build on minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  docker:
    name: relay Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  homebrew:
    name: Homebrew formula (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p panosync
      - name: Render the formula from a local archive and test it
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          case "$RUNNER_OS-$(uname -m)" in
            macOS-arm64) target=aarch64-apple-darwin ;;
            macOS-x86_64) target=x86_64-apple-darwin ;;
            Linux-x86_64) target=x86_64-unknown-linux-gnu ;;
            Linux-aarch64) target=aarch64-unknown-linux-gnu ;;
          esac
          mkdir -p dist
          tar -C target/release -czf "dist/panosync-$target.tar.gz" panosync
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            if [ "$t" = "$target" ]; then (cd dist && shasum -a 256 "panosync-$t.tar.gz"); else printf '%064d  panosync-%s.tar.gz\n' 0 "$t"; fi
          done > dist/SHA256SUMS
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "panosync") | .version')"

          brew tap-new --no-git panosync/ci
          # Homebrew refuses to load formulae from non-official taps until they are trusted.
          # (`brew install <user>/<tap>/<formula>` trusts the formula automatically; audit does not.)
          brew trust --tap panosync/ci
          formula="$(brew --repository panosync/ci)/Formula/panosync.rb"
          # Lint the formula as it will be published (release URLs)...
          packaging/homebrew/render-formula.sh "$version" dist/SHA256SUMS > "$formula"
          brew style panosync/ci/panosync
          brew audit --strict --formula panosync/ci/panosync
          # ...then install it from the local archive.
          packaging/homebrew/render-formula.sh "$version" dist/SHA256SUMS "file://$PWD/dist" > "$formula"
          brew install panosync/ci/panosync
          brew test panosync/ci/panosync
          panosync --version
