name: Pages

# Publishes the project page (site/ plus assets/ and the demo GIF) to GitHub Pages.

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", "docs/demo.gif", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp assets/*.svg assets/*.png assets/favicon.ico _site/assets/
          cp docs/demo.gif _site/assets/demo.gif
          ls -R _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
