name: Release

# Runs when a version tag is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Builds the client for every platform, creates a *draft* GitHub Release with the archives
# and SHA256SUMS, and pushes the relay image to ghcr.io. Publish the draft by hand; publishing triggers
# homebrew.yml, which updates the formula in msbayindir/homebrew-tap.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # 22.04 keeps the glibc requirement low (2.35), so the binary also runs on older distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p panosync --target ${{ matrix.target }}

      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/panosync-${{ matrix.target }}.tar.gz panosync
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/panosync.exe -DestinationPath dist/panosync-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: panosync-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum panosync-* > SHA256SUMS
          for f in panosync-*; do sha256sum "$f" > "$f.sha256"; done
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true

  docker:
    name: relay image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/panosync-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # `latest` is added automatically for non-prerelease tags.
          labels: |
            org.opencontainers.image.title=panosync-relay
            org.opencontainers.image.description=Relay server for panosync (end-to-end encrypted clipboard sync)
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
